<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detector 0 Annotation Workbench</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --ink: #16202a;
        --muted: #5b6773;
        --line: #cfd6de;
        --accent: #1864ab;
        --accent-strong: #124b80;
        --draft: #0b7285;
        --anchor: #7c2d12;
        --danger: #a61e4d;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      .file-input-label {
        min-height: 2.25rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        padding: 0.45rem 0.7rem;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      button:hover,
      .file-input-label:hover {
        border-color: var(--accent-strong);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      canvas:focus-visible {
        outline: 3px solid rgba(24, 100, 171, 0.3);
        outline-offset: 2px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 650;
        letter-spacing: 0;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 22rem;
        min-height: calc(100vh - 4rem);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--line);
        background: #eef2f6;
      }

      .toolbar select,
      .toolbar input[type="number"] {
        min-height: 2.25rem;
        max-width: 16rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        padding: 0.35rem 0.55rem;
      }

      .file-input-label input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      .stage-column {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .stage {
        display: grid;
        place-items: center;
        min-height: 30rem;
        padding: 1rem;
      }

      .canvas-shell {
        width: min(100%, 48rem);
        aspect-ratio: 1 / 1;
        border: 1px solid var(--line);
        background: #20262d;
        display: grid;
        place-items: center;
      }

      canvas {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        touch-action: none;
      }

      aside {
        min-width: 0;
        border-left: 1px solid var(--line);
        background: var(--surface);
      }

      section {
        padding: 1rem;
        border-bottom: 1px solid var(--line);
      }

      h2 {
        margin: 0 0 0.65rem;
        font-size: 0.95rem;
        font-weight: 650;
        letter-spacing: 0;
      }

      dl {
        display: grid;
        grid-template-columns: 8rem minmax(0, 1fr);
        gap: 0.35rem 0.75rem;
        margin: 0;
        font-size: 0.9rem;
      }

      dt {
        color: var(--muted);
      }

      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .target-list {
        display: grid;
        gap: 0.5rem;
      }

      .target-row {
        display: grid;
        grid-template-columns: 1rem minmax(0, 1fr);
        gap: 0.45rem;
        align-items: start;
        font-size: 0.9rem;
      }

      .swatch {
        width: 0.8rem;
        height: 0.8rem;
        margin-top: 0.25rem;
        border-radius: 3px;
        background: var(--draft);
      }

      .anchor .swatch {
        background: var(--anchor);
      }

      .muted {
        color: var(--muted);
      }

      .status {
        overflow-wrap: anywhere;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .danger {
        color: var(--danger);
      }

      @media (max-width: 860px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          display: block;
        }

        aside {
          border-left: 0;
          border-top: 1px solid var(--line);
        }

        .stage {
          min-height: 22rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Detector 0 Annotation Workbench</h1>
      <div class="status" id="status">Load a prepared local index.</div>
    </header>

    <main>
      <div class="stage-column">
        <div class="toolbar" aria-label="Workbench controls">
          <label class="file-input-label">
            Load index
            <input id="indexFile" type="file" accept="application/json,.json" />
          </label>
          <button id="prevFrame" type="button" aria-label="Previous frame">Prev</button>
          <select id="frameSelect" aria-label="Frame"></select>
          <button id="nextFrame" type="button" aria-label="Next frame">Next</button>
          <select id="targetSelect" aria-label="Target">
            <option value="left_or_first_hand">left_or_first_hand</option>
            <option value="right_or_second_hand">right_or_second_hand</option>
            <option value="head_or_face">head_or_face</option>
            <option value="upper_body_or_signing_space">upper_body_or_signing_space</option>
            <option value="table_two_hand_union_or_contact_region">table_two_hand_union_or_contact_region</option>
          </select>
          <button id="clearTarget" type="button">Clear target</button>
          <button id="exportDraft" class="primary" type="button">Export draft</button>
        </div>

        <div class="stage">
          <div class="canvas-shell">
            <canvas id="canvas" width="96" height="96" tabindex="0" aria-label="Frame annotation canvas"></canvas>
          </div>
        </div>
      </div>

      <aside>
        <section>
          <h2>Frame</h2>
          <dl id="frameDetails"></dl>
        </section>
        <section>
          <h2>Draft Targets</h2>
          <div id="draftTargets" class="target-list"></div>
        </section>
        <section>
          <h2>Existing V0 Anchors</h2>
          <div id="anchorTargets" class="target-list"></div>
        </section>
      </aside>
    </main>

    <script>
      "use strict";

      const TARGET_COLORS = {
        left_or_first_hand: "#0b7285",
        right_or_second_hand: "#1864ab",
        head_or_face: "#5f3dc4",
        upper_body_or_signing_space: "#2b8a3e",
        table_two_hand_union_or_contact_region: "#e67700",
      };
      const DRAFT_SCHEMA_VERSION = "asl-pilot-detector0-annotator-draft/v1";
      const COORDINATE_SPACE = "normalized_full_frame_top_left_xyxy";

      const elements = {
        status: document.querySelector("#status"),
        indexFile: document.querySelector("#indexFile"),
        prevFrame: document.querySelector("#prevFrame"),
        nextFrame: document.querySelector("#nextFrame"),
        frameSelect: document.querySelector("#frameSelect"),
        targetSelect: document.querySelector("#targetSelect"),
        clearTarget: document.querySelector("#clearTarget"),
        exportDraft: document.querySelector("#exportDraft"),
        frameDetails: document.querySelector("#frameDetails"),
        draftTargets: document.querySelector("#draftTargets"),
        anchorTargets: document.querySelector("#anchorTargets"),
        canvas: document.querySelector("#canvas"),
      };

      const state = {
        index: null,
        frameIndex: 0,
        image: new Image(),
        drafts: new Map(),
        dragStart: null,
        dragCurrent: null,
      };

      const ctx = elements.canvas.getContext("2d", { alpha: false });

      function setStatus(message, danger = false) {
        elements.status.textContent = message;
        elements.status.classList.toggle("danger", danger);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function normalizeBox(start, end) {
        const x1 = clamp(Math.min(start.x, end.x), 0, elements.canvas.width);
        const y1 = clamp(Math.min(start.y, end.y), 0, elements.canvas.height);
        const x2 = clamp(Math.max(start.x, end.x), 0, elements.canvas.width);
        const y2 = clamp(Math.max(start.y, end.y), 0, elements.canvas.height);
        if (Math.abs(x2 - x1) < 2 || Math.abs(y2 - y1) < 2) return null;
        return [
          Number((x1 / elements.canvas.width).toFixed(4)),
          Number((y1 / elements.canvas.height).toFixed(4)),
          Number((x2 / elements.canvas.width).toFixed(4)),
          Number((y2 / elements.canvas.height).toFixed(4)),
        ];
      }

      function denormalizeBox(box) {
        return {
          x: box[0] * elements.canvas.width,
          y: box[1] * elements.canvas.height,
          w: (box[2] - box[0]) * elements.canvas.width,
          h: (box[3] - box[1]) * elements.canvas.height,
        };
      }

      function activeFrame() {
        return state.index?.frames?.[state.frameIndex] ?? null;
      }

      function activeDrafts() {
        const frame = activeFrame();
        if (!frame) return {};
        if (!state.drafts.has(frame.row_id)) state.drafts.set(frame.row_id, {});
        return state.drafts.get(frame.row_id);
      }

      function canvasPoint(event) {
        const rect = elements.canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * elements.canvas.width,
          y: ((event.clientY - rect.top) / rect.height) * elements.canvas.height,
        };
      }

      function drawBox(box, color, dashed = false) {
        const rect = denormalizeBox(box);
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.setLineDash(dashed ? [4, 3] : []);
        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        ctx.restore();
      }

      function draw() {
        ctx.fillStyle = "#20262d";
        ctx.fillRect(0, 0, elements.canvas.width, elements.canvas.height);
        if (!state.image.complete || !state.image.naturalWidth) return;
        ctx.drawImage(state.image, 0, 0, elements.canvas.width, elements.canvas.height);

        const frame = activeFrame();
        if (frame?.existing_v0_targets) {
          for (const [targetId, target] of Object.entries(frame.existing_v0_targets)) {
            if (target?.presence && Array.isArray(target.box_xyxy_norm)) {
              drawBox(target.box_xyxy_norm, "#7c2d12", true);
            }
          }
        }

        for (const [targetId, target] of Object.entries(activeDrafts())) {
          if (target?.presence && Array.isArray(target.box_xyxy_norm)) {
            drawBox(target.box_xyxy_norm, TARGET_COLORS[targetId] ?? "#0b7285", false);
          }
        }

        if (state.dragStart && state.dragCurrent) {
          const preview = normalizeBox(state.dragStart, state.dragCurrent);
          if (preview) drawBox(preview, TARGET_COLORS[elements.targetSelect.value] ?? "#0b7285", false);
        }
      }

      function renderKeyValueList(node, entries) {
        node.innerHTML = "";
        for (const [label, value] of entries) {
          const dt = document.createElement("dt");
          dt.textContent = label;
          const dd = document.createElement("dd");
          dd.textContent = value ?? "-";
          node.append(dt, dd);
        }
      }

      function targetRows(targets, anchor = false) {
        const root = document.createDocumentFragment();
        const entries = Object.entries(targets ?? {});
        if (entries.length === 0) {
          const empty = document.createElement("div");
          empty.className = "muted";
          empty.textContent = "No boxes.";
          root.append(empty);
          return root;
        }
        for (const [targetId, target] of entries) {
          const row = document.createElement("div");
          row.className = `target-row${anchor ? " anchor" : ""}`;
          const swatch = document.createElement("span");
          swatch.className = "swatch";
          if (!anchor) swatch.style.background = TARGET_COLORS[targetId] ?? "#0b7285";
          const body = document.createElement("div");
          const label = document.createElement("strong");
          label.textContent = targetId;
          const detail = document.createElement("div");
          detail.className = "muted";
          detail.textContent =
            target?.presence && Array.isArray(target.box_xyxy_norm)
              ? target.box_xyxy_norm.join(", ")
              : "absent";
          body.append(label, detail);
          row.append(swatch, body);
          root.append(row);
        }
        return root;
      }

      function refreshPanels() {
        const frame = activeFrame();
        if (!frame) {
          renderKeyValueList(elements.frameDetails, []);
          elements.draftTargets.replaceChildren(targetRows({}));
          elements.anchorTargets.replaceChildren(targetRows({}));
          return;
        }
        renderKeyValueList(elements.frameDetails, [
          ["row", frame.row_id],
          ["split", frame.split],
          ["label", frame.label_id],
          ["clip", frame.clip_id],
          ["frame", String(frame.frame_index)],
          ["image", frame.image_path],
          ["tensor", frame.tensor_path],
          ["space", frame.coordinate_space],
        ]);
        elements.draftTargets.replaceChildren(targetRows(activeDrafts()));
        elements.anchorTargets.replaceChildren(targetRows(frame.existing_v0_targets, true));
      }

      function loadFrame(index) {
        if (!state.index?.frames?.length) return;
        state.frameIndex = clamp(index, 0, state.index.frames.length - 1);
        elements.frameSelect.value = String(state.frameIndex);
        const frame = activeFrame();
        state.image = new Image();
        state.image.addEventListener("load", () => {
          elements.canvas.width = state.image.naturalWidth;
          elements.canvas.height = state.image.naturalHeight;
          draw();
        });
        state.image.addEventListener("error", () => {
          setStatus(`Could not load ${frame.image_path}`, true);
          draw();
        });
        state.image.src = frame.image_path;
        setStatus(`Frame ${state.frameIndex + 1} of ${state.index.frames.length}: ${frame.row_id}`);
        refreshPanels();
      }

      function loadIndex(index) {
        if (!index || !Array.isArray(index.frames) || index.frames.length === 0) {
          throw new Error("Index has no frames.");
        }
        state.index = index;
        state.frameIndex = 0;
        state.drafts.clear();
        elements.frameSelect.innerHTML = "";
        index.frames.forEach((frame, idx) => {
          const option = document.createElement("option");
          option.value = String(idx);
          option.textContent = `${idx + 1}. ${frame.split}/${frame.label_id}/${frame.row_id}`;
          elements.frameSelect.append(option);
        });
        loadFrame(0);
      }

      elements.indexFile.addEventListener("change", () => {
        const file = elements.indexFile.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          try {
            loadIndex(JSON.parse(String(reader.result)));
          } catch (error) {
            setStatus(error.message, true);
          }
        });
        reader.addEventListener("error", () => setStatus("Could not read index file.", true));
        reader.readAsText(file);
      });

      elements.prevFrame.addEventListener("click", () => loadFrame(state.frameIndex - 1));
      elements.nextFrame.addEventListener("click", () => loadFrame(state.frameIndex + 1));
      elements.frameSelect.addEventListener("change", () => loadFrame(Number(elements.frameSelect.value)));

      elements.clearTarget.addEventListener("click", () => {
        const drafts = activeDrafts();
        drafts[elements.targetSelect.value] = {
          presence: false,
          box_xyxy_norm: null,
          coordinate_space: COORDINATE_SPACE,
          status: "draft_unreviewed_not_authoritative",
        };
        refreshPanels();
        draw();
      });

      elements.exportDraft.addEventListener("click", () => {
        if (!state.index) {
          setStatus("Load an index before exporting.", true);
          return;
        }
        const rows = [];
        for (const frame of state.index.frames) {
          const targets = state.drafts.get(frame.row_id);
          if (targets && Object.keys(targets).length > 0) {
            rows.push({
              row_id: frame.row_id,
              split: frame.split,
              label_id: frame.label_id,
              clip_id: frame.clip_id,
              frame_index: frame.frame_index,
              image_path: frame.image_path,
              tensor_path: frame.tensor_path,
              coordinate_space: COORDINATE_SPACE,
              targets,
            });
          }
        }
        const draft = {
          schema_version: DRAFT_SCHEMA_VERSION,
          exported_at: new Date().toISOString(),
          status: "draft_unreviewed_not_authoritative_labels",
          source_index_schema_version: state.index.schema_version,
          boundaries: {
            local_browser_export_only: true,
            uploads_media_or_labels: false,
            runs_inference_or_auto_labels: false,
            authoritative_label_packet: false,
          },
          rows,
        };
        const blob = new Blob([JSON.stringify(draft, null, 2) + "\n"], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `detector0-draft-${new Date().toISOString().replace(/[:.]/g, "-")}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
        setStatus(`Exported ${rows.length} draft row(s).`);
      });

      elements.canvas.addEventListener("pointerdown", (event) => {
        if (!activeFrame()) return;
        elements.canvas.setPointerCapture(event.pointerId);
        state.dragStart = canvasPoint(event);
        state.dragCurrent = state.dragStart;
        draw();
      });

      elements.canvas.addEventListener("pointermove", (event) => {
        if (!state.dragStart) return;
        state.dragCurrent = canvasPoint(event);
        draw();
      });

      elements.canvas.addEventListener("pointerup", (event) => {
        if (!state.dragStart) return;
        state.dragCurrent = canvasPoint(event);
        const box = normalizeBox(state.dragStart, state.dragCurrent);
        state.dragStart = null;
        state.dragCurrent = null;
        if (box) {
          activeDrafts()[elements.targetSelect.value] = {
            presence: true,
            box_xyxy_norm: box,
            coordinate_space: COORDINATE_SPACE,
            status: "draft_unreviewed_not_authoritative",
          };
          refreshPanels();
        }
        draw();
      });

      elements.canvas.addEventListener("pointercancel", () => {
        state.dragStart = null;
        state.dragCurrent = null;
        draw();
      });

      draw();
    </script>
  </body>
</html>
